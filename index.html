<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects — Max Kessler</title>
<meta name="description" content="Side projects and experiments by Max Kessler.">
<style>
  :root {
    --bg: #fafaf8;
    --text: #141414;
    --muted: #6b6b6b;
    --line: #e4e4e0;
    --card: #ffffff;
    --accent: #141414;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --text: #f2f2ef;
      --muted: #9a9a96;
      --line: #2a2a28;
      --card: #191918;
      --accent: #f2f2ef;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 72px 24px 48px; }

  header { margin-bottom: 56px; }
  .name {
    font-size: 14px;
    color: var(--muted);
    text-decoration: none;
  }
  .name:hover { color: var(--text); }
  h1 {
    font-size: clamp(36px, 6vw, 56px);
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.05;
    margin: 10px 0 14px;
  }
  .intro { color: var(--muted); max-width: 520px; font-size: 17px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }
  .card {
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    text-decoration: none;
    transition: transform .15s ease, border-color .15s ease;
  }
  a.card:hover { transform: translateY(-2px); border-color: var(--muted); }
  .thumb {
    aspect-ratio: 16 / 10;
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    border-bottom: 1px solid var(--line);
  }
  .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .year { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .desc { color: var(--muted); font-size: 15px; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag {
    font-size: 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 10px;
    color: var(--muted);
  }
  .link { font-size: 14px; font-weight: 500; margin-top: 4px; }
  .soon { opacity: .55; }

  footer {
    margin-top: 72px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 14px;
    color: var(--muted);
  }
  footer a { text-decoration: none; }
  footer a:hover { color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="name" href="https://maxkessler.com">← Max Kessler</a>
    <h1>Projects</h1>
    <p class="intro">Side projects, experiments and small tools I've built.</p>
  </header>

  <main class="grid" id="grid"></main>

  <footer>
    <span>© <span id="yr"></span> Max Kessler</span>
    <span><a href="mailto:hi@maxkessler.com">hi@maxkessler.com</a> · <a href="https://maxkessler.com">maxkessler.com</a></span>
  </footer>
</div>

<script>
  // ─────────────────────────────────────────────
  // ADD / EDIT PROJECTS HERE
  // image: path to a screenshot (e.g. "images/pickem.png"); leave "" to use the emoji + color
  // url:   leave "" to show the card as "Coming soon"
  // ─────────────────────────────────────────────
  const projects = [
    {
      title: "Movie Pick'em",
      year: "2026",
      desc: "Pick a movie three at a time from 7,000+ streaming favorites, with slot-machine shuffles, trailers and Kids & Adults modes.",
      url: "https://maxkessler-commits.github.io/moviepickem/",
      tags: ["Web app", "Movies"],
      image: "",
      emoji: "🎬",
      color: "#f3e6c8"
    },
    {
      title: "Next project",
      year: "",
      desc: "Something new is in the works.",
      url: "",
      tags: [],
      image: "",
      emoji: "✳️",
      color: "#e3e8ef"
    }
  ];

  const grid = document.getElementById("grid");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  projects.forEach(p => {
    const live = Boolean(p.url);
    const el = document.createElement(live ? "a" : "div");
    el.className = "card" + (live ? "" : " soon");
    if (live) { el.href = p.url; el.target = "_blank"; el.rel = "noopener"; }

    const thumbStyle = p.image
      ? `background-image:url('${esc(p.image)}')`
      : `background:${esc(p.color || "#eee")}`;

    el.innerHTML = `
      <div class="thumb" style="${thumbStyle}">${p.image ? "" : esc(p.emoji || "")}</div>
      <div class="body">
        <div class="row">
          <span class="title">${esc(p.title)}</span>
          <span class="year">${esc(p.year || "")}</span>
        </div>
        <p class="desc">${esc(p.desc)}</p>
        ${p.tags && p.tags.length ? `<div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
        <span class="link">${live ? "Visit ↗" : "Coming soon"}</span>
      </div>`;
    grid.appendChild(el);
  });

  document.getElementById("yr").textContent = new Date().getFullYear();
</script>
</body>
</html>
