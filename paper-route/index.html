<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Paper Route</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#14121c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:"Press Start 2P",monospace;color:#fff}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;box-shadow:0 0 0 4px #000}
.touch{position:fixed;z-index:5;display:none}
body.is-touch .touch{display:block}
body.menu .touch{opacity:.25;pointer-events:none}
#pad{left:max(14px,env(safe-area-inset-left));bottom:14px;width:38vh;height:38vh;max-width:190px;max-height:190px;border-radius:50%;background:rgba(0,0,0,.28);border:3px solid rgba(255,255,255,.45)}
#pad i{position:absolute;color:rgba(255,255,255,.6);font-style:normal;font-size:12px}
#knob{position:absolute;left:50%;top:50%;width:40%;height:40%;margin:-20% 0 0 -20%;border-radius:50%;background:rgba(255,255,255,.55);border:3px solid #fff;box-sizing:border-box}
#throw{right:max(14px,env(safe-area-inset-right));bottom:18px;width:30vh;height:30vh;max-width:150px;max-height:150px;border-radius:50%;background:rgba(220,50,50,.75);border:4px solid #fff;color:#fff;font:inherit;font-size:11px;display:none;align-items:center;justify-content:center;box-sizing:border-box}
body.is-touch #throw{display:flex}
#throw.down{background:rgba(255,120,80,.95);transform:scale(.94)}
.top{position:fixed;top:8px;z-index:6;display:flex;gap:8px;right:max(10px,env(safe-area-inset-right))}
.top button{font:inherit;font-size:10px;background:rgba(0,0,0,.55);color:#fff;border:2px solid #fff;padding:7px 9px;border-radius:4px}
.ov{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(10,8,20,.55)}
.ov.show{display:flex}
.panel{background:#1d2a5a;border:4px solid #fff;box-shadow:0 0 0 4px #000,8px 8px 0 4px rgba(0,0,0,.5);padding:18px 22px;text-align:center;max-width:min(560px,88vw);max-height:86vh;overflow:auto}
.panel h1{font-size:clamp(18px,5vh,30px);margin:4px 0 14px;color:#ffd84a;text-shadow:3px 3px 0 #c0392b}
.panel h2{font-size:clamp(16px,4.4vh,24px);margin:4px 0 12px;color:#ffd84a;text-shadow:2px 2px 0 #000}
.panel p{font-size:clamp(9px,2.4vh,12px);line-height:1.8;margin:8px 0}
.panel .y{color:#ffd84a}.panel .g{color:#7dff8a}
.panel .small{font-size:clamp(8px,2vh,10px);color:#b8c4ff}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.panel button{font:inherit;font-size:clamp(11px,2.8vh,14px);padding:12px 18px;background:#e84a3a;color:#fff;border:3px solid #fff;box-shadow:0 4px 0 #7a1d14;border-radius:4px;cursor:pointer}
.panel button.alt{background:#3a7ae8;box-shadow:0 4px 0 #1b3d82}
.panel button:active{transform:translateY(3px);box-shadow:0 1px 0 #7a1d14}
.stars{font-size:clamp(18px,5vh,28px);letter-spacing:6px;color:#ffd84a;margin:6px 0}
#rotate{position:fixed;inset:0;z-index:50;background:#14121c;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;line-height:2;font-size:12px}
#rotate .ph{width:50px;height:84px;border:4px solid #fff;border-radius:8px;margin-bottom:22px;animation:rot 2s infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){body.is-touch #rotate{display:flex}}
</style>
<style>*{touch-action:manipulation}html,body,canvas{touch-action:none}</style>
<script>
/* stop iPhone/iPad double-tap and pinch zoom from moving the game */
(()=>{let last=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-last<400)e.preventDefault();last=n},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
})();
</script>
</head>
<body class="menu">
<div id="wrap"><canvas id="c" width="480" height="270"></canvas></div>
<div id="pad" class="touch"><i style="left:46%;top:6px">▲</i><i style="left:46%;bottom:6px">▼</i><i style="left:8px;top:45%">◀</i><i style="right:8px;top:45%">▶</i><div id="knob"></div></div>
<button id="throw" class="touch">THROW</button>
<div class="top"><button id="bMute">♪ ON</button><button id="bPause">II</button></div>
<div id="ov" class="ov show"><div class="panel" id="panel"></div></div>
<div id="rotate"><div class="ph"></div>Turn your phone<br>sideways to play!</div>
<script>
(()=>{
const W=480,H=270;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isTouch)document.body.classList.add('is-touch');
const FONT='"Press Start 2P", monospace';

/* ---------- layout ---------- */
function resize(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
}
addEventListener('resize',resize);resize();

/* ---------- drawing helpers ---------- */
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)};
function line(x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;ctx.fillStyle=c;
  for(let i=0;i<200;i++){ctx.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
function txt(s,x,y,c='#fff',size=8,align='left'){ctx.font=size+'px '+FONT;ctx.textAlign=align;ctx.textBaseline='top';
  ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);ctx.fillStyle=c;ctx.fillText(s,x,y)}
const RING=[];for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++){const d=Math.hypot(dx,dy);if(d>=3.4&&d<=4.7)RING.push([dx,dy])}
function wheel(cx,cy,a){for(const[dx,dy]of RING)R(cx+dx,cy+dy,1,1,'#111');
  const c=Math.round(Math.cos(a)*2.4),s=Math.round(Math.sin(a)*2.4);R(cx+c,cy+s,1,1,'#ccc');R(cx-c,cy-s,1,1,'#ccc');R(cx,cy,1,1,'#777')}
function heart(x,y,c){R(x+1,y,2,1,c);R(x+4,y,2,1,c);R(x,y+1,7,2,c);R(x+1,y+3,5,1,c);R(x+2,y+4,3,1,c);R(x+3,y+5,1,1,c)}
function paperIcon(x,y){R(x,y,9,6,'#f4f4ec');R(x+1,y+1,4,1,'#555');R(x+1,y+3,7,1,'#999');R(x,y+5,9,1,'#bbb')}

/* ---------- audio ---------- */
let AC=null,muted=false,musicOn=true,musicNext=0,musicStep=0;
function ensureAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(f,d,type='square',vol=.07,slide=0,delay=0){if(!AC||muted)return;try{
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
const SFX={
  toss:()=>beep(700,.07,'square',.04,-350),
  deliver:()=>[523,659,784].forEach((f,i)=>beep(f,.11,'square',.06,0,i*.07)),
  mail:()=>[659,784,1047,1319].forEach((f,i)=>beep(f,.11,'square',.06,0,i*.06)),
  crash:()=>{beep(260,.45,'sawtooth',.09,-200);beep(120,.3,'square',.06,-60,.05)},
  pick:()=>{beep(880,.07,'square',.05);beep(1319,.12,'square',.05,0,.07)},
  bark:()=>{beep(330,.06,'square',.05,-120);beep(300,.07,'square',.05,-120,.12)},
  splash:()=>beep(500,.18,'triangle',.07,-380),
  honk:()=>{beep(330,.22,'square',.04);beep(415,.22,'square',.04)},
  empty:()=>beep(120,.08,'square',.05),
  oops:()=>beep(220,.12,'triangle',.06,-60),
  win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>beep(f,.14,'square',.06,0,i*.11)),
};
// tiny original chiptune loop
const MEL=[659,0,784,659,587,0,523,587,659,0,659,784,880,784,659,0, 587,0,659,587,523,0,440,523,587,659,587,523,494,523,587,0];
const BASS=[131,196,175,196,131,196,147,196];
function music(){if(!AC||muted||!musicOn||S!=='play')return;const step=.16;
  while(musicNext<AC.currentTime+.3){const t0=musicNext-AC.currentTime;const m=MEL[musicStep%MEL.length];
    if(m)beep(m,.13,'square',.018,0,t0);if(musicStep%4===0)beep(BASS[(musicStep/4|0)%BASS.length],.3,'triangle',.05,0,t0);
    musicStep++;musicNext+=step}}


/* ---------- oblique projection (Paperboy-style: street runs bottom-left to top-right) ---------- */
const AX=.55,AY=-.8,BX=262,OY=222;let camU=0;
const P=(u,v,h=0)=>[BX+(u-camU)*AX+v,OY+(u-camU)*AY-h];
function poly(pts,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(Math.round(pts[0][0]),Math.round(pts[0][1]));
  for(let i=1;i<pts.length;i++)ctx.lineTo(Math.round(pts[i][0]),Math.round(pts[i][1]));ctx.closePath();ctx.fill()}
const gq=(u0,u1,v0,v1,c,h=0)=>poly([P(u0,v0,h),P(u0,v1,h),P(u1,v1,h),P(u1,v0,h)],c);
const wallV=(v,u0,u1,h0,h1,c)=>poly([P(u0,v,h0),P(u1,v,h0),P(u1,v,h1),P(u0,v,h1)],c);
const wallU=(u,v0,v1,h0,h1,c)=>poly([P(u,v0,h0),P(u,v1,h0),P(u,v1,h1),P(u,v0,h1)],c);
function box(u0,u1,v0,v1,h0,h1,top,side,end){wallV(v1,u0,u1,h0,h1,side);gq(u0,u1,v0,v1,top,h1);wallU(u0,v0,v1,h0,h1,end)}
function shade(hex,f){const n=parseInt(hex.slice(1),16);return`rgb(${(n>>16)*f|0},${(n>>8&255)*f|0},${(n&255)*f|0})`}

/* ---------- sprites (drawn upright at a ground point) ---------- */
const SKIN='#f1c27d';
function shadow(x,y,w){R(x-w/2,y-1,w,3,'rgba(0,0,0,.25)')}
function drawKid(sx,sy,wa){
  wheel(sx-7,sy-5,wa);wheel(sx+8,sy-5,wa);
  const Y='#f0c020';
  line(sx-7,sy-5,sx,sy-6,Y);line(sx,sy-6,sx-2,sy-12,Y);line(sx-7,sy-5,sx-2,sy-12,Y);
  line(sx-2,sy-11,sx+6,sy-12,Y);line(sx,sy-6,sx+6,sy-12,Y);line(sx+6,sy-12,sx+8,sy-5,Y);
  line(sx+6,sy-12,sx+5,sy-15,'#999');R(sx+3,sy-16,4,1,'#222');R(sx-4,sy-13,4,1,'#222');
  const pa=wa*0.8,px=sx+Math.round(Math.cos(pa)*3),py=sy-6+Math.round(Math.sin(pa)*3);
  line(sx-2,sy-14,px,py,'#2b4ea8');line(sx-1,sy-14,px+1,py,'#2b4ea8');R(px,py,3,1,'#222');
  R(sx-4,sy-21,7,8,'#d83a3a');R(sx-4,sy-21,7,1,'#ff6a5a');
  R(sx-8,sy-19,4,7,'#f4f4ec');R(sx-8,sy-19,4,1,'#c8c8b8');line(sx-6,sy-19,sx+1,sy-21,'#8a6a3a');
  line(sx+1,sy-19,sx+5,sy-16,SKIN);
  R(sx-3,sy-27,6,6,SKIN);R(sx+1,sy-25,1,1,'#222');R(sx+2,sy-23,1,1,'#c98b5a');
  R(sx-4,sy-29,7,3,'#2a62d8');R(sx+3,sy-27,3,1,'#1a42a8');
}
function drawDog(x,y,t,run,c){c=c||'#a0652d';shadow(x,y,20);const f=run?Math.floor(t*10)%2:0;
  const hi=c==='#2a2a2a'?'#4a4a4a':shade(c,1.15),lg=shade(c,.75),ear=c==='#ece6da'?'#7a5a3a':shade(c,.55),eye=c==='#2a2a2a'?'#ddd':'#222';
  R(x-6,y-9,13,5,c);R(x-6,y-9,13,1,hi);if(c==='#ece6da'){R(x-2,y-8,3,2,'#3a3a3a');R(x+3,y-7,2,2,'#3a3a3a')}
  R(x-11,y-13,6,6,c);R(x-12,y-10,2,3,c);R(x-13,y-9,1,1,'#222');
  R(x-10,y-12,1,1,eye);R(x-8,y-14,2,3,ear);
  R(x-5,y-4,2,f?4:3,lg);R(x-1,y-4,2,f?3:4,lg);R(x+2,y-4,2,f?4:3,lg);R(x+5,y-4,2,f?3:4,lg);
  R(x+7,y-12+f,2,4,c);R(x-7,y-7,1,1,'#e33');if(run&&f)R(x-13,y-8,2,2,'#ff7a9a')}
const DOGC=['#a0652d','#2a2a2a','#ece6da','#d8a040','#8a5a3a'];
/* ---------- Dryden Road extras ---------- */
function drawFirePit(x,y,t){shadow(x,y,22);
  R(x-10,y-5,20,5,'#7a7a80');for(let i=0;i<5;i++)R(x-10+i*4,y-5,3,2,i%2?'#9a9aa2':'#8a8a92');
  R(x-7,y-5,14,2,'#2a1a10');R(x-5,y-6,10,2,'#6b4a2b');R(x-3,y-7,6,1,'#8a5a3a');
  for(let i=0;i<4;i++){const h=6+((t*14+i*5)|0)%6;R(x-5+i*3,y-6-h,3,h,'#ff6a1a');R(x-4+i*3,y-6-(h*.6|0),1,(h*.6|0),'#ffd84a')}
  for(let i=0;i<3;i++){const k=(t*.8+i/3)%1;R(x-1+Math.round(Math.sin(t*2+i*2)*3),y-16-k*22,2,2,k<.25?'#ffb04a':'rgba(200,200,200,'+(1-k)*.6+')')}}
function drawFireGuy(x,y,t,wave){shadow(x,y,18);const NAVY='#0b2547',GRN='#69be28',GRY='#a5acaf';
  line(x-6,y,x+5,y-8,'#555');line(x+5,y,x-6,y-8,'#555');R(x-7,y-10,13,3,'#2a62d8');R(x+3,y-20,4,11,'#2a62d8');
  R(x-9,y-9,5,3,'#3a4a6a');R(x-11,y-7,2,6,'#3a4a6a');R(x-12,y-1,4,2,'#3a2a1a');
  R(x-5,y-19,8,10,NAVY);R(x-5,y-12,8,1,GRN);R(x-5,y-11,8,1,GRY);
  R(x-4,y-25,6,6,SKIN);R(x-4,y-21,6,2,'#6a3a1a');R(x-3,y-23,1,1,'#222');
  R(x-5,y-28,8,4,NAVY);R(x-5,y-26,8,1,GRN);R(x-1,y-29,2,1,GRN);
  R(x-8,y-15,3,2,NAVY);R(x-9,y-16,3,3,'#e8e8e8');R(x-9,y-16,3,1,'#8a5a3a');
  if(wave){const a=Math.sin(t*10)>0?1:0;R(x+3,y-20-a,2,4,NAVY);R(x+3+a,y-25-a,3,3,SKIN)}else R(x+2,y-15,3,2,NAVY)}
function drawHawksFlag(x,y,t){shadow(x,y,6);R(x,y-48,2,48,'#cfcfd4');R(x-1,y-50,4,2,'#ffd84a');
  const NAVY='#0b2547',GRN='#69be28',GRY='#a5acaf';
  for(let c=0;c<18;c++){const o=Math.round(Math.sin(t*5-c*.45)*1.6*(c/18));const fx=x+2+c,fy=y-47+o;
    R(fx,fy,1,4,NAVY);R(fx,fy+4,1,2,GRN);R(fx,fy+6,1,1,GRY);R(fx,fy+7,1,4,NAVY)}}
function drawHoop(x,y){shadow(x,y,10);R(x-1,y-40,3,40,'#5a5a62');R(x-1,y-40,1,40,'#7a7a82');R(x-1,y-2,3,2,'#333');
  R(x-9,y-53,18,12,'#fff');R(x-9,y-53,18,1,'#ccc');R(x-9,y-42,18,1,'#bbb');
  R(x-4,y-50,8,1,'#e8402a');R(x-4,y-50,1,5,'#e8402a');R(x+3,y-50,1,5,'#e8402a');
  R(x-5,y-41,10,2,'#ff5a1a');for(let i=0;i<4;i++)R(x-4+i*3,y-39,1,5,'#f4f4f4');R(x-3,y-35,7,1,'#f4f4f4')}
function drawBall(x,y,t){const b=Math.round(Math.abs(Math.sin(t*7))*9);shadow(x,y,8+Math.round((9-b)/2));const cy=y-5-b;
  for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++)if(dx*dx+dy*dy<=17)R(x+dx,cy+dy,1,1,(dx*dx+dy*dy>12)?'#b8521a':'#e8742a');
  R(x-4,cy,9,1,'#3a1a0a');R(x,cy-4,1,9,'#3a1a0a');R(x-2,cy-2,1,1,'#ffb07a')}
function drawHoopTarget(x,y,t,hit){drawHoop(x,y);if(hit){const s=Math.round(Math.sin(t*14)*1);R(x-3+s,y-38,7,4,'#ffd84a');drawBall(x+12,y,t)}}
function drawSign(x,y){R(x,y-34,2,34,'#7a7a82');R(x-17,y-42,36,9,'#1f7a3a');R(x-16,y-41,34,7,'#2a9a4a');R(x-17,y-42,36,1,'#fff');R(x-17,y-34,36,1,'#fff');
  txt('DRYDEN RD',x+1,y-41,'#fff',5,'center')}
function drawCan(x,y){shadow(x,y,14);
  R(x-5,y-13,10,12,'#7d8a94');R(x-3,y-13,1,12,'#5d6a74');R(x+1,y-13,1,12,'#5d6a74');R(x+4,y-13,1,12,'#9daab4');
  R(x-6,y-15,12,2,'#5d6a74');R(x-2,y-17,4,2,'#5d6a74')}
function drawHydrant(x,y){shadow(x,y,12);R(x-3,y-11,6,10,'#d83a3a');R(x-4,y-3,8,2,'#a82a2a');R(x-5,y-9,10,3,'#a82a2a');
  R(x-3,y-13,6,2,'#ff5a4a');R(x-1,y-15,2,2,'#a82a2a');R(x+1,y-10,1,6,'#ff7a6a')}
function drawGrate(x,y){R(x-9,y-4,18,7,'#222');for(let i=0;i<5;i++)R(x-8+i*4,y-3,2,5,'#666');R(x-9,y-4,18,1,'#888')}
function drawTire(x,y,t){shadow(x,y,12);const cy=y-7;
  for(let dy=-7;dy<=7;dy++)for(let dx=-7;dx<=7;dx++){const d=Math.hypot(dx,dy);if(d<=6.8&&d>=3.2)R(x+dx,cy+dy,1,1,d>5.6?'#111':'#2a2a2a')}
  const a=t*8;R(x+Math.round(Math.cos(a)*2),cy+Math.round(Math.sin(a)*2),2,2,'#999');R(x-1,cy-1,2,2,'#777')}
function drawSkater(x,y,t){shadow(x,y,16);const b=Math.round(Math.sin(t*6));
  R(x-8,y-4,16,2,'#c0602d');R(x-6,y-2,2,2,'#222');R(x+4,y-2,2,2,'#222');
  line(x-3,y-5,x-2,y-11,'#2b3a8a');line(x+3,y-5,x+1,y-11,'#2b3a8a');

    L(hp,kn,c);L([hp[0]+1,hp[1]],[kn[0]+1,kn[1]],c);L(kn,pd,c);L([kn[0]+1,kn[1]],[pd[0]+1,pd[1]],c);R(pd[0]-1,pd[1],3,2,'#222')};

  while(subs<10){const l=lots[Math.floor(rnd()*n)];if(!l.sub){l.sub=true;subs++}}
  while(subs>12){const l=lots[Math.floor(rnd()*n)];if(l.sub){l.sub=false;subs--}}
  lots[4].sub=true;
  const iu=120+10*LOT+10,endU=lots[n-1].u+LOT+40,bonusEnd=endU+1000;
  const obs=[];
  for(const L of lots){if(L.hedge)obs.push({type:'hedge',u:L.u,v:-106});
    if(L.tree)obs.push({type:'tree',u:L.u+140,v:-118});
    obs.push({type:'mailbox',u:L.u+150,v:-66,L});
    if(L.hoop)obs.push({type:'hoop',u:L.u+120,v:-96});
    if(L.pit){obs.push({type:'flag',u:L.u+8,v:-122});obs.push({type:'firepit',u:L.u+42,v:-100});obs.push({type:'fireguy',u:L.u+50,v:-118})}}
  if(withObs){
    const pool=[];const sh=mode==='normal'?cfg.unlockShift:0;
    for(let k=0;k<=Math.min(UNLOCK.length-1,d+sh);k++)pool.push(...UNLOCK[k]);
    pool.push('dog','dog');
    let lastU=-999;const dens=cfg.dens+cfg.densUp*d;
    for(let i=0;i<n;i++){const L=lots[i];if(i===0)continue;
      const k=Math.floor(dens+rnd()),us=[];for(let j=0;j<k;j++)us.push(L.u+10+rnd()*(LOT-20));us.sort((a,b)=>a-b);
      for(const u of us){if(u-lastU<58)continue;lastU=u;const type=pool[Math.floor(rnd()*pool.length)];const o={type,u,ph:rnd()*6};
        switch(type){
          case'can':o.v=-54+rnd()*20;break;case'hydrant':o.v=-35;break;
          case'grate':o.v=rnd()<.6?-17:52;break;case'dancer':o.v=-46;break;
          case'dog':o.v=-110+rnd()*60;o.c=DOGC[Math.floor(rnd()*DOGC.length)];break;case'tire':o.v=rnd()<.6?-45:5;o.u+=120;break;
          case'ball':o.v=rnd()<.6?-45:5;o.u+=120;break;
          case'trike':o.bv=-60;o.v=-60;break;case'skater':o.v=-45;o.bv=-45;o.u+=140;break;
          case'mower':o.v=-96;o.bu=o.u;break;case'rc':o.bv=20;o.v=20;o.u+=80;break;
          case'worker':o.v=5+rnd()*35;break}
        obs.push(o)}
      if(i%4===2)obs.push({type:'bundle',u:L.u+LOT/2,v:rnd()<.6?-45:10});
      if(i!==4&&i!==10&&rnd()<.3)obs.push({type:'dog',u:L.u+95,v:-124,c:DOGC[Math.floor(rnd()*DOGC.length)],ph:0});
    }
    // bonus course: targets + ramps
    for(let u=endU+80,i=0;u<bonusEnd-60;u+=95,i++){
      obs.push(i%3===1?{type:'hooptarget',u,v:-92}:{type:'target',u,v:i%2?-95:-80});
      if(i%2===0)obs.push({type:'ramp',u:u+40,v:rnd()<.5?-44:16});
      else if(rnd()<.6)obs.push({type:'can',u:u+45,v:rnd()<.5?-50:30});
    }
  }
  return{lots,obs,iu,endU,bonusEnd,subs};
}

function padMove(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,rad=r.width/2;
  let dx=(e.clientX-cx)/rad,dy=(e.clientY-cy)/rad;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}
  pd={x:dx,y:dy};knob.style.transform=`translate(${dx*rad*.55}px,${dy*rad*.55}px)`}

const padEnd=e=>{if(e.pointerId===padId){padId=null;pd={x:0,y:0};knob.style.transform=''}};

/* ---------- game logic ---------- */
function pop(u,v,h,s,c='#fff'){run.pops.push({u,v,h,s,c,t:0})}
function burst(u,v,h,cols,n=12){for(let i=0;i<n;i++)run.parts.push({u,v,h,vu:(rnd()-.5)*60,vv:(rnd()-.5)*80,vh:60+rnd()*90,c:cols[i%cols.length],t:0})}
const MAILV=-66;
function doThrow(){
  if(run.paper<=0){if(run.emptyT<=0){SFX.empty();pop(run.u,run.v,40,'NO PAPERS!','#ff8a7a');run.emptyT=1}return}
  run.paper--;run.throwCd=.25;run.throwT=.25;SFX.toss();
  const p={u:run.u+3,v:run.v-9,v0:run.v-9,vu:run.speed+8,vv:-240,age:0};
  if(run.phase==='street'){
    const tm=(p.v-MAILV)/240,win=cfg.assist?30:7;let aimed=false;
    if(tm>.02)for(const L of run.lots){if(!L.sub||L.delivered)continue;const mu=L.u+150,pu=p.u+p.vu*tm;
      if(Math.abs(pu-mu)<win){p.vu=(mu-p.u)/tm;aimed=true;break}}
    if(!aimed&&cfg.assist){const tl=(p.v-HF)/240,lu=p.u+p.vu*tl;let bestL=null,bd=100;
      for(const L of run.lots){if(!L.sub||L.delivered)continue;const d=Math.abs(lu-(L.u+75));if(d<bd){bd=d;bestL=L}}
      if(bestL){const tu=Math.max(bestL.u+30,Math.min(bestL.u+120,lu));p.vu=(tu-p.u)/tl}}
    p.vu=Math.max(-20,Math.min(run.speed+220,p.vu));
  }
  run.papers.push(p);
}
function deliver(L,mail){L.delivered=true;run.delivered++;const pts=mail?250:100;G.score+=pts;
  if(mail){L.mail=true;SFX.mail();pop(L.u+150,MAILV,40,'MAILBOX! +250','#ffd84a');burst(L.u+150,MAILV,20,['#ffd84a','#7dff8a','#ff7aa8','#7ac8ff'],14)}
  else{SFX.deliver();pop(L.u+75,HF,50,'+100','#7dff8a');burst(L.u+75,HF+8,4,['#ffd84a','#7dff8a','#ff7aa8','#7ac8ff'],14)}}
function crash(o){run.crash=1.1;run.speed=0;run.jump=0;SFX.crash();
  burst(run.u,run.v,14,['#ffd84a','#fff','#ff6a5a'],16);
  if(run.phase==='bonus'){pop(run.u,run.v,40,'CRASH!','#ff8a7a');run.bonusCrash=true}
  else{G.lives--;run.inv=cfg.inv+1.1;pop(run.u,run.v,40,G.lives>0?'OUCH!':'OH NO!','#ff8a7a')}
  if(o&&o.type!=='hedge'&&o.type!=='tree'&&o.type!=='mailbox'&&o.type!=='grate'&&o.type!=='hydrant'&&!['hoop','firepit','fireguy','flag','hooptarget'].includes(o.type))o.dead=true}
const ov2=(au,av,aw,ah,bu,bv,bw,bh)=>Math.abs(au-bu)<(aw+bw)/2&&Math.abs(av-bv)<(ah+bh)/2;

function update(dt){
  readInput();run.t+=dt;camU=run.u;
  if(run.crash>0){run.crash-=dt;run.speed=0;
    if(run.crash<=0){
      if(run.bonusCrash){endDay();return}
      if(G.lives<=0){S='over';saveBest();
        show(`<h2>OUT OF BIKES!</h2><p>You delivered <span class="g">${run.delivered}</span> papers.</p><p>Score: ${G.score}</p><div class="row"><button class="primary" data-a="retry">TRY AGAIN</button><button class="alt" data-a="title">MENU</button></div>`);return}
      run.speed=cfg.min}}
  else{
    let target=cfg.base;if(inp.up)target=cfg.max;else if(inp.down)target=cfg.min;
    run.speed+=(target-run.speed)*Math.min(1,dt*2.5);
    // Paperboy-style steering: the bike turns gradually, then drifts across the street
    const want=(inp.right?1:0)-(inp.left?1:0);
    run.steer+=(want-run.steer)*Math.min(1,dt*(want?4:6));
    run.v+=Math.sin(run.steer*.55)*(run.speed*1.15+35)*dt;
    if(run.v<-140||run.v>64){run.v=Math.max(-140,Math.min(64,run.v));}
    if(inp.throw&&run.throwCd<=0)doThrow();
  }
  inp.throw=false;run.throwCd-=dt;run.throwT=Math.max(0,run.throwT-dt);run.inv-=dt;run.emptyT-=dt;if(run.jump>0)run.jump-=dt;
  run.u+=run.speed*dt;run.wheel+=run.speed*dt/4;camU=run.u;

  // papers in flight
  for(const p of run.papers){const pv=p.v;p.u+=p.vu*dt;p.v+=p.vv*dt;p.age+=dt;
    for(const o of run.obs){if(o.dead||o.hit||!SMACK[o.type])continue;
      if(o.type==='target'||o.type==='hooptarget'?ov2(p.u,p.v,10,10,o.u,o.v,o.type==='hooptarget'?18:14,o.type==='hooptarget'?18:14):ov2(p.u,p.v,10,10,o.u,o.v,FOOT[o.type][0],FOOT[o.type][1])){
        const pts=SMACK[o.type];G.score+=pts;p.dead=true;SFX.pick();burst(o.u,o.v,10,['#fff','#ffd84a'],10);
        if(o.type==='target'){o.hit=true;run.targets++;pop(o.u,o.v,40,'BULLSEYE +'+pts,'#ffd84a')}
        else if(o.type==='hooptarget'){o.hit=true;run.targets++;pop(o.u,o.v,50,'SWISH! +'+pts,'#ffb04a')}
        else{o.dead=true;run.smacks++;pop(o.u,o.v,30,'BONK! +'+pts,'#ffd84a')}break}}
    if(p.dead)continue;
    if(run.phase==='street'&&pv>MAILV&&p.v<=MAILV){for(const L of run.lots){if(L.sub&&!L.delivered&&Math.abs(p.u-(L.u+150))<10){deliver(L,true);p.dead=true;break}}}
    if(!p.dead&&p.v<=HF+2){p.dead=true;const L=run.lots.find(L=>p.u>=L.u+10&&p.u<=L.u+160);
      if(L&&run.phase==='street'){L.landed.push({u:p.u,v:HF+3+rnd()*6});
        if(L.sub&&!L.delivered)deliver(L,false);else if(!L.sub){SFX.oops();pop(p.u,HF,30,'NOT THIS ONE','#d8d8e0')}}}}
  run.papers=run.papers.filter(p=>!p.dead);

  // traffic
  if(run.phase==='street'){
    const near=run.endU-run.u>500;
    if(G.day>=cfg.carDay&&near){run.carT-=dt;if(run.carT<=0){run.carT=1/cfg.carRate*(.6+rnd()*.8);
      const moto=G.day>=cfg.motoDay&&rnd()<.3;
      run.obs.push({type:moto?'moto':'car',u:camU+460,v:moto?(rnd()<.5?2:40):(rnd()<.5?8:44),warn:1.6,c:['#d83a3a','#3a7ae8','#e8a83a','#7a3ae8','#2fa860'][Math.floor(rnd()*5)]})}}
    // cross traffic at the intersection
    if(run.iu-run.u<420&&run.u<run.iu+80){run.xT-=dt;if(run.xT<=0){run.xT=1/cfg.xRate*(.7+rnd()*.6);
      const dir=rnd()<.5?1:-1;run.obs.push({type:'xcar',u:run.iu+(dir>0?18:52),v:dir>0?-330:330,dir,warn:1.2,c:['#d83a3a','#3a7ae8','#e8a83a','#2fa860'][Math.floor(rnd()*4)]})}}
  }

  // obstacles
  const safe=run.inv>0||run.crash>0||run.jump>0;
  for(const o of run.obs){if(o.dead)continue;const ahead=o.u-run.u<330;
    switch(o.type){
      case'dog':if(Math.abs(o.u-run.u)<140){o.run=true;o.v+=Math.sign(run.v-o.v)*Math.min(Math.abs(run.v-o.v),32*dt);o.v=Math.max(-130,Math.min(-30,o.v));
        if(!o.barked){o.barked=true;SFX.bark()}}else o.run=false;break;
      case'tire':if(ahead)o.u-=45*dt;break;
      case'ball':if(ahead)o.u-=50*dt;break;
      case'fireguy':o.wave=Math.abs(o.u-run.u)<130;if(!o.cheered&&o.u-run.u<70){o.cheered=true;pop(o.u,o.v,44,'GO HAWKS!','#69be28')}break;
      case'skater':if(ahead){o.u-=38*dt;o.v=o.bv+Math.sin(run.t*2+o.ph)*8}break;
      case'rc':if(ahead){o.u-=22*dt;o.v=o.bv+Math.sin(run.t*2.6+o.ph)*24}break;
      case'trike':o.v=o.bv+Math.sin(run.t*.8+o.ph)*26;break;
      case'mower':o.u=o.bu+Math.sin(run.t*.7+o.ph)*24;break;
      case'car':case'moto':if(o.warn>0){o.warn-=dt;o.u=camU+460}else{o.u-=(o.type==='moto'?105:(mode==='easy'?55:75))*dt;if(!o.honked&&o.u-run.u<260){o.honked=true;SFX.honk()}}break;
      case'xcar':if(o.warn>0)o.warn-=dt;else{o.v+=o.dir*cfg.xSpeed*dt;if(!o.honked&&Math.abs(o.v-run.v)<220){o.honked=true;SFX.honk()}}if(Math.abs(o.v)>360)o.dead=true;break;
    }
    if(o.type==='hedge'){if(!safe&&Math.abs(run.u-o.u)<9&&run.v<-56)crash(o);continue}
    const f=FOOT[o.type];if(!f||o.hit)continue;
    if(ov2(run.u,run.v,10,12,o.u,o.v,f[0],f[1])){
      if(o.type==='bundle'){o.dead=true;run.paper=Math.min(cfg.cap,run.paper+5);SFX.pick();pop(o.u,o.v,30,'+5 PAPERS','#7ac8ff')}
      else if(o.type==='ramp'){if(run.jump<=0&&run.crash<=0){run.jump=.75;SFX.mail();pop(o.u,o.v,40,'JUMP!','#7dff8a');G.score+=25}}
      else if(o.type==='target'||o.type==='hooptarget'){}
      else if(!safe&&!(o.warn>0))crash(o);
    }
  }
  run.obs=run.obs.filter(o=>!o.dead&&o.u>camU-140);
  if(run.phase==='street'&&run.paper===0&&!run.obs.some(o=>o.type==='bundle'&&o.u>run.u)&&run.u<run.endU-300)
    run.obs.push({type:'bundle',u:camU+330,v:-45});

  for(const p of run.parts){p.t+=dt;p.u+=p.vu*dt;p.v+=p.vv*dt;p.h+=p.vh*dt;p.vh-=300*dt}
  run.parts=run.parts.filter(p=>p.t<.9&&p.h>-2);
  for(const p of run.pops)p.t+=dt;run.pops=run.pops.filter(p=>p.t<1.3);

  if(run.phase==='street'&&run.u>=run.endU){run.phase='bonus';run.paper=Math.max(run.paper,10);SFX.win();
    pop(run.u+60,run.v,40,'BONUS RUN!','#ffd84a');pop(run.u+70,run.v,26,'HIT THE TARGETS','#fff')}
  if(run.phase==='bonus'&&run.u>=run.bonusEnd&&run.crash<=0)endDay();
}
function endDay(){if(S!=='play')return;S='results';const d=run.delivered,s=run.subs;const perfect=d===s;
  const bonus=d*50+(perfect?500:0)+(run.bonusCrash?0:300);G.score+=bonus;saveBest();SFX.win();
  const stars=d/s>=1?3:d/s>=.6?2:d>0?1:0;const last=G.day>=DAYS.length-1;
  show(`<h2>${last?'YOU DID THE WHOLE WEEK!':DAYS[G.day]+' DONE!'}</h2>
   <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
   <p>Delivered <span class="g">${d} of ${s}</span> houses</p>
   <p class="small">Targets hit: ${run.targets} · Bonks: ${run.smacks}${run.bonusCrash?'':' · Finished bonus run +300'}</p>
   <p>Bonus +${bonus}${perfect?' <span class="y">PERFECT!</span>':''}</p><p>Score: ${G.score}</p>
   <div class="row">${last?'<button class="primary" data-a="title">PLAY AGAIN</button>':'<button class="primary" data-a="next">NEXT DAY ▶</button>'}</div>`)}

/* ---------- render ---------- */
function drawObj(o,t){const[x,y]=P(o.u,o.v).map(Math.round);
  switch(o.type){
    case'can':drawCan(x,y);break;case'hydrant':drawHydrant(x,y);break;case'grate':drawGrate(x,y);break;
    case'dog':drawDog(x,y,t,o.run,o.c);break;case'ball':drawBall(x,y,t);break;case'hoop':drawHoop(x,y);break;
    case'firepit':drawFirePit(x,y,t);break;case'fireguy':drawFireGuy(x,y,t,o.wave);break;case'flag':drawHawksFlag(x,y,t);break;
    case'hooptarget':drawHoopTarget(x,y,t,o.hit);break;case'tire':drawTire(x,y,t);break;case'skater':drawSkater(x,y,t);break;
    case'rc':drawRC(x,y,t);break;case'trike':drawTrike(x,y,t);break;case'dancer':drawDancer(x,y,t);break;
    case'mower':drawMower(x,y,t);break;case'worker':drawWorker(x,y,t);break;case'moto':if(!(o.warn>0))drawMoto(x,y,t);break;
    case'car':if(!(o.warn>0))drawCar(o);break;case'xcar':if(!(o.warn>0))drawXCar(o);break;
    case'tree':drawTree(x,y,false);break;case'bundle':drawBundle(x,y,t);break;case'target':drawTarget(x,y,o.hit);break;
    case'ramp':drawRamp(o);break;
    case'hedge':box(o.u-4,o.u+4,-150,-62,0,10,'#4aa04a','#2f7d2f','#276a27');break;
    case'mailbox':drawMailbox(x,y,o.L,t,cfg.assist&&!!run);break;
  }}
function render(){
  const t=run?run.t:performance.now()/1000;const world=run||demo;
  camU=run?run.u:(t*40)%(demo.endU-300);
  const uA=camU-180,uB=camU+460;
  R(0,0,W,H,'#3f8f3f');
  gq(uA,uB,-700,-60,'#56b04a');
  for(const L of world.lots)if(L.u+LOT>uA&&L.u<uB)drawLotGround(L);
  gq(uA,uB,-60,-30,'#cdc7b8');
  for(let u=Math.floor(uA/20)*20;u<uB;u+=20){const a=P(u,-60),b=P(u,-30);R(a[0],a[1],b[0]-a[0],1,'#a9a395')}
  gq(uA,uB,-30,-26,'#8d8d8d');gq(uA,uB,-26,70,'#4a4a54');
  for(let u=Math.floor(uA/34)*34;u<uB;u+=34)gq(u,u+16,21,23,'#e8d050');
  gq(uA,uB,70,74,'#8d8d8d');gq(uA,uB,74,98,'#cdc7b8');
  for(let u=Math.floor(uA/20)*20;u<uB;u+=20){const a=P(u,74),b=P(u,98);R(a[0],a[1],b[0]-a[0],1,'#a9a395')}
  const iu=world.iu;
  if(iu+70>uA&&iu<uB){gq(iu,iu+70,-700,500,'#4a4a54');
    for(let u=iu+4;u<iu+68;u+=8){gq(u,u+4,-58,-32,'#e8e8e8');gq(u,u+4,76,96,'#e8e8e8')}
    for(let v=-690;v<-70;v+=30)gq(iu+34,iu+36,v,v+14,'#e8d050');for(let v=110;v<340;v+=30)gq(iu+34,iu+36,v,v+14,'#e8d050')}
  if(run){for(const p of run.obs)if(p.type==='grate'){const[x,y]=P(p.u,p.v).map(Math.round);drawGrate(x,y)}}
  // objects (far first)
  const items=[];
  for(const L of world.lots)if(L.u+LOT>uA&&L.u<uB)items.push({k:L.u+25,f:()=>drawHouse(L,t)});
  for(const o of world.obs)if(o.type!=='grate'&&o.u>uA&&o.u<uB)items.push({k:o.type==='car'?o.u-22:o.type==='hedge'?o.u+4:o.u,f:()=>drawObj(o,t)});
  for(let i=Math.floor(uA/95);i<uB/95;i++){const u=i*95;if(Math.abs(u-iu-35)<60)continue;const v=112+((i*53)%60+60)%60;items.push({k:u,f:()=>{const[x,y]=P(u,v).map(Math.round);drawTree(x,y,false)}})}
  for(const su of[70,iu-8])if(su>uA&&su<uB)items.push({k:su,f:()=>{const[x,y]=P(su,-50).map(Math.round);drawSign(x,y)}});
  if(run){items.push({k:run.endU,f:()=>drawBanner(run.endU,'BONUS RUN','#3a7ae8')});items.push({k:run.bonusEnd,f:()=>drawBanner(run.bonusEnd,'FINISH','#e84a3a')});
    items.push({k:run.u,kid:1,f:()=>{
      const jh=run.jump>0?Math.sin(Math.PI*(1-run.jump/.75))*18:0;const[x,y]=P(run.u,run.v).map(Math.round);
      if(run.crash>0){ctx.save();ctx.translate(x,y);ctx.rotate(-Math.min(1,(1.1-run.crash)*3)*1.3);ctx.translate(-x,-y);drawRider(run.u,run.v,0,run.wheel,0,0);ctx.restore();
        for(let i=0;i<3;i++){const a=t*6+i*2.1;R(x+Math.cos(a)*9-1,y-34+Math.sin(a)*3,2,2,'#ffd84a')}}
      else if(!(run.inv>0&&Math.floor(t*10)%2))drawRider(run.u,run.v,jh,run.wheel,run.steer,run.throwT)}})}
  items.sort((a,b)=>b.k-a.k||(a.kid?1:-1));for(const it of items)it.f();
  if(!run)return;
  // warnings for incoming traffic
  if(Math.floor(t*6)%2)for(const o of run.obs){if(!(o.warn>0))continue;let x,y;
    if(o.type==='xcar'){[x,y]=P(o.u,0);x=o.dir>0?6:W-18}else{[x,y]=P(camU+290,o.v);x=Math.min(W-18,x);y=Math.max(20,y)}
    R(x,y-7,12,14,'#ffd84a');R(x+5,y-5,2,7,'#111');R(x+5,y+4,2,2,'#111')}
  // papers
  for(const p of run.papers){const prog=Math.min(1,(p.v0-p.v)/(p.v0-HF)),h=Math.sin(prog*Math.PI)*20+10;
    const[sx,sy]=P(p.u,p.v).map(Math.round);R(sx-2,sy,5,1,'rgba(0,0,0,.3)');
    if(Math.floor(p.age*18)%2){R(sx-3,sy-h-1,7,3,'#f4f4ec');R(sx-3,sy-h+1,7,1,'#999')}else{R(sx-1,sy-h-3,3,7,'#f4f4ec');R(sx+1,sy-h-3,1,7,'#999')}}
  for(const p of run.parts){const[x,y]=P(p.u,p.v,p.h);R(x,y,2,2,p.c)}
  for(const p of run.pops){const a=p.t<1?1:1-(p.t-1)/.3;ctx.globalAlpha=Math.max(0,a);const[x,y]=P(p.u,p.v,p.h+p.t*18);txt(p.s,Math.max(50,Math.min(W-50,x)),y,p.c,8,'center');ctx.globalAlpha=1}
  // HUD
  R(0,0,W,15,'rgba(0,0,0,.65)');
  txt(DAYS[G.day].slice(0,3),5,4,'#ffd84a');
  txt(String(G.score).padStart(6,'0'),40,4,'#fff');
  paperIcon(108,4);txt('x'+run.paper,120,4,run.paper?'#fff':'#ff6a5a');
  for(let i=0;i<Math.max(0,G.lives);i++)heart(160+i*9,4,'#ff4a5a');
  txt(run.phase==='bonus'?'BONUS RUN':'HOUSES '+run.delivered+'/'+run.subs,214,4,run.phase==='bonus'?'#7ac8ff':'#7dff8a');
  R(W-12,22,6,200,'rgba(0,0,0,.4)');const pr=Math.min(1,run.u/run.bonusEnd),ep=run.endU/run.bonusEnd;
  R(W-11,22+200*(1-ep),4,200*ep,'#245a24');R(W-11,22,4,200*(1-ep),'#24405a');R(W-11,22+200*(1-pr),4,200*pr,'#ffd84a');
  R(W-14,22+200*(1-pr)-2,10,4,'#d83a3a');
}

/* ---------- loop ---------- */
let lastT=performance.now();
function frame(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(S==='play'&&run)update(dt);
  render();music();requestAnimationFrame(frame)}
const startUp=()=>{title();requestAnimationFrame(frame)};
if(document.fonts&&document.fonts.load){Promise.race([document.fonts.load('8px "Press Start 2P"'),new Promise(r=>setTimeout(r,1500))]).then(startUp,startUp)}else startUp();
})();
</script>
</body>
</html>
